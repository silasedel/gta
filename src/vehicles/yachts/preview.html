<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Port Solana V2: yacht preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0b1420; overflow: hidden; font: 13px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #e9f1f5; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 10px; background: rgba(8, 16, 24, .62); padding: 8px 12px; border-radius: 8px; max-width: 420px; pointer-events: none; white-space: pre-line; }
  #ui b { color: #ffd98a; }
  #prompt { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); background: rgba(8, 16, 24, .7); padding: 7px 14px; border-radius: 8px; display: none; }
  #sub { position: fixed; left: 50%; bottom: 6%; transform: translateX(-50%); max-width: 70%; text-align: center; text-shadow: 0 1px 3px #000; font-size: 16px; }
</style>
</head>
<body>
<div id="ui"></div><div id="prompt"></div><div id="sub"></div>
<script type="module" src="./preview.js"></script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><title>vehicle sandbox</title>
<style>html,body{margin:0;height:100%;background:#222;overflow:hidden}#hud{position:fixed;left:8px;top:8px;color:#fff;font:14px monospace}</style></head>
<body><div id="hud"></div><script type="module">
import * as THREE from 'three';
import RAPIER from '@dimforge/rapier3d-compat';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createVehicles } from './vehicles.js';
import { preloadCharacters } from '../player/characterModel.js';
await RAPIER.init();
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const tod = +(q.get('t') || 17.5); const night = tod < 6.6 || tod > 18.7;
scene.background = new THREE.Color(night ? 0x0a0c18 : 0xe8b48a);
scene.fog = new THREE.Fog(scene.background, 60, 400);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = night ? 0.12 : 0.8;
const sun = new THREE.DirectionalLight(0xffd6a8, night ? 0.05 : 2.5); sun.position.set(-30, 40, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 });
scene.add(sun, sun.target); scene.add(new THREE.HemisphereLight(0xffe0c0, 0x303040, night ? 0.05 : 0.5));
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ color: 0x404044, roughness: 0.85 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// ?stream: ground exists only as 40 m tiles near the moving player (emulates Miami collider streaming)
const STREAM = q.has('stream'); const tiles = new Map(); const removingCbs = []; const TS = 40;
if (!STREAM) world.createCollider(RAPIER.ColliderDesc.cuboid(400, 1, 400).setTranslation(0, -1, 0));
function streamTiles(p, rIn = 90, rOut = 115) {
  for (let i = -10; i < 10; i++) for (let j = -10; j < 10; j++) {
    const cx = i * TS + TS / 2, cz = j * TS + TS / 2, key = i + ',' + j, d = Math.hypot(cx - p.x, cz - p.z);
    if (d < rIn && !tiles.has(key)) tiles.set(key, world.createCollider(RAPIER.ColliderDesc.cuboid(TS / 2, 1, TS / 2).setTranslation(cx, -1, cz)));
    else if (d > rOut && tiles.has(key)) {
      for (const f of removingCbs) f({ minX: cx - TS / 2, maxX: cx + TS / 2, minZ: cz - TS / 2, maxZ: cz + TS / 2 });
      world.removeCollider(tiles.get(key), false); tiles.delete(key); window.__removed = (window.__removed || 0) + 1;
    }
  }
}
const xs = [-200, -100, 0, 100, 200], zs = [-200, -100, 0, 100, 200], roads = [], buildings = [];
for (const x of xs) roads.push({ x1: x, z1: -200, x2: x, z2: 200, width: 14 });
for (const z of zs) roads.push({ x1: -200, z1: z, x2: 200, z2: z, width: 14 });
const bm = new THREE.MeshStandardMaterial({ color: 0xc8b8a8, roughness: 0.8 });
for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < zs.length - 1; j++) {
  const x = xs[i] + 50, z = zs[j] + 50, w = 72, d = 72, h = 8 + ((i * 7 + j * 13) % 5) * 6;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bm); m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  world.createCollider(RAPIER.ColliderDesc.cuboid(w / 2, h / 2, d / 2).setTranslation(x, h / 2, z));
  buildings.push({ x, z, w, d, h });
}
const keys = new Set(); addEventListener('keydown', (e) => keys.add(e.code)); addEventListener('keyup', (e) => keys.delete(e.code));
const game = {
  THREE, RAPIER, world, scene, camera, renderer, fixedHooks: [], updaters: [], clock: { elapsed: 0, dt: 0 }, timeOfDay: tod,
  player: { position: new THREE.Vector3(5, 0, -20), heading: 0, velocity: new THREE.Vector3(), state: { inVehicle: false }, wanted: +(q.get('wanted') || 0) },
  city: { half: 200, grid: { block: 100, roadWidth: 14, xs, zs, laneOffsets: [1.75, 5.25] }, roads, buildings, playerSpawn: new THREE.Vector3(9, 0, -20),
    ...(q.has('water') ? { seaLevel: 1.0, isWater: (x, z) => z > 0 } : {}),
    ...(STREAM && !q.has('nofix') ? { onTileCollidersRemoving: (f) => removingCbs.push(f), collidersReadyAt: (x, z) => tiles.has(Math.floor(x / TS) + ',' + Math.floor(z / TS)) } : {}) },
};
window.game = game;
if (q.has('chars')) { try { await preloadCharacters(game); } catch (e) { console.warn(e); } }
if (STREAM) streamTiles(game.player.position);
game.vehicles = await createVehicles(game);
const me = game.vehicles.list[0];
if (q.has('drive')) { me.playerDriven = true; game.player.state.inVehicle = true; game.player.state.vehicle = me; }
let camYaw = 0; const cp = new THREE.Vector3();
// scripted headless runs: ?auto=drift|ai&secs=N&focus=i&cam=dx,dy,dz
let streamT = 0, sweep = 0;
function simStep(h, ctrl) {
  if (ctrl) me.setControls(ctrl);
  if (STREAM) {
    // player runs a lap around the grid roads at 25 m/s
    sweep += 25 * h; const per = 1600, u = sweep % per;
    const P = game.player.position;
    if (u < 400) P.set(-200 + u, 0, -200); else if (u < 800) P.set(200, 0, -200 + (u - 400)); else if (u < 1200) P.set(200 - (u - 800), 0, 200); else P.set(-200, 0, 200 - (u - 1200));
    if ((streamT += h) > 0.25) { streamT = 0; streamTiles(P); }
  }
  try { const a = performance.now(); for (const f of game.fixedHooks) f(h); const b = performance.now(); world.step(); const c = performance.now();
    if (game.clock.elapsed > 5) { window.__hk = (window.__hk || 0) + (b - a); window.__st = (window.__st || 0) + (c - b); window.__n = (window.__n || 0) + 1; } } catch (e) { console.error('PANIC ' + e); window.__panic = String(e); throw e; }
  game.clock.elapsed += h;
  const t = me.body.translation(); if (me.playerDriven) game.player.position.set(t.x, t.y, t.z);
  const fc = q.get('focus') && !STREAM ? game.vehicles.list[+q.get('focus')] : null;
  if (fc && !me.playerDriven) { const ft = fc.body.translation(); game.player.position.set(ft.x + 8, 0, ft.z + 8); }
  game.vehicles.update(h);
}
const auto = q.get('auto');
if (auto) {
  const secs = +(q.get('secs') || 5), h = 1 / 60;
  if (auto === 'ram') {
    const b = game.city.buildings[5];
    me.body.setTranslation({ x: b.x - b.w / 2 - 20, y: 0.7, z: b.z + 20 }, true);
    me.body.setRotation({ x: 0, y: Math.sin(Math.PI / 4), z: 0, w: Math.cos(Math.PI / 4) }, true);
    me.body.setLinvel({ x: +(q.get('v') || 18), y: 0, z: 0 }, true); me.bodySway = null;
  }
  for (let i = 0; i < secs * 60; i++) {
    const t = i * h;
    let c = { throttle: 0, steer: 0, brake: 0, handbrake: false };
    if (auto === 'drift') {
      if (t < 3) c.throttle = 1;
      else if (t < 3.7) { c.throttle = 0.4; c.steer = 1; c.handbrake = true; }
      else if (t < 5) { c.throttle = 0.7; c.steer = -0.3; }
      else c.brake = 1;
    }
    if (auto === 'brake') { if (t < 3.5) c.throttle = 1; else c.brake = 1; }
    simStep(h, me.playerDriven ? c : null);
  }
  if (q.get('focus')) window.camTarget = game.vehicles.list[+q.get('focus')];
  const L = game.vehicles.list, ai = L.filter((v) => v.ai);
  console.log('STATS ' + JSON.stringify({ n: L.length, ai: ai.length, resp: game.vehicles.respawnCount,
    spd: ai.map((v) => Math.round(v.speedKmh)).join(','), stuck: ai.filter((v) => v.ai.stuckT > 3).length,
    dmg: L.filter((v) => v.health < 1000).map((v) => v.typeKey + ':' + Math.round(v.health)).join(' '),
    lat: ai.map((v) => { if (!v.ai.edge) return 'x'; const t = v.body.translation(); return v.ai.edge.id; }).slice(0, 6).join(','),
    stacked: (() => { let n = 0; for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) { const a = L[i].body.translation(), b = L[j].body.translation(); if (Math.hypot(a.x - b.x, a.z - b.z) < 2.2) n++; } return n; })(),
    me: { sub: me.submerged, flooded: me.flooded, engineOn: me.engineOn, y: +me.body.translation().y.toFixed(2), kmh: Math.round(me.speedKmh) },
    high: L.filter((v) => v.body.translation().y > v.groundOff + 1.2).length,
    frozen: L.filter((v) => v.frozen).length, fell: L.filter((v) => v.body.translation().y < -2).length, tilesRemoved: window.__removed || 0, panic: window.__panic || null,
    hookMs: +((window.__hk || 0) / (window.__n || 1)).toFixed(3), stepMs: +((window.__st || 0) / (window.__n || 1)).toFixed(3) }));
}
if (q.get('cam')) window.camOff = new THREE.Vector3(...q.get('cam').split(',').map(Number));
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  game.clock.dt = dt; game.clock.elapsed += dt;
  if (me.playerDriven && !auto) {
    const W = keys.has('KeyW') ? 1 : 0, S = keys.has('KeyS') ? 1 : 0;
    const fs = me.speed;
    me.setControls({ throttle: W - (S && fs < 1 ? 1 : 0), steer: (keys.has('KeyA') ? 1 : 0) - (keys.has('KeyD') ? 1 : 0), brake: S && fs > 1 ? 1 : 0, handbrake: keys.has('Space') });
    if (keys.has('KeyH')) { me.horn(); keys.delete('KeyH'); }
    if (keys.has('KeyR')) { me.flip(); keys.delete('KeyR'); }
    const t = me.body.translation(); game.player.position.set(t.x, t.y, t.z);
  }
  const steps = auto ? 0 : Math.max(1, Math.ceil(dt * 60 - 0.01)); const h = dt / steps; world.timestep = h;
  for (let i = 0; i < steps; i++) { for (const f of game.fixedHooks) f(h); world.step(); }
  for (const u of game.updaters) u(dt);
  if (!auto) game.vehicles.update(dt);
  const tgt = window.camTarget || me;
  const m = tgt.mesh; camYaw += ((tgt.heading || 0) - camYaw) * Math.min(1, dt * 3);
  const want = new THREE.Vector3(m.position.x - Math.sin(camYaw) * 7.5, m.position.y + 2.6, m.position.z - Math.cos(camYaw) * 7.5);
  if (window.camOff) want.copy(m.position).add(window.camOff);
  if (q.get('camL')) { want.set(...q.get('camL').split(',').map(Number)); m.localToWorld(want); window.camOff = true; }
  cp.lerp(want, window.camOff ? 1 : Math.min(1, dt * 8)); camera.position.copy(cp); camera.lookAt(m.position.x, m.position.y + 0.8, m.position.z);
  sun.position.set(cp.x - 30, 40, cp.z + 20); sun.target.position.set(cp.x, 0, cp.z);
  document.getElementById('hud').textContent = `${me.speedKmh.toFixed(0)} km/h roll ${(me.car.shell.rotation.z*57.3).toFixed(1)} pitch ${(me.car.shell.rotation.x*57.3).toFixed(1)} n=${game.vehicles.list.length} resp=${game.vehicles.respawnCount}`;
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script></body></html>

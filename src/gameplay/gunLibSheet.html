<!doctype html>
<html><head><meta charset="utf-8"><title>Southline: weapon library sheet</title>
<style>html,body{margin:0;background:#15181c;overflow:hidden;font-family:system-ui,sans-serif}.t{position:fixed;color:#e8e8e8;font:600 12px/1.25 system-ui;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none}</style></head>
<body>
<script type="module">
// Library weapon review (tools/v2/weapons): orthographic LEFT-side views (+X toward the camera, barrel to the right),
// 1 cm / 5 cm grid around the grip origin, red = muzzle, green = grip origin, blue = left-hand grip, yellow = sight, cyan = eject.
// ?keys=a,b,c (default: all in the manifest)  &cols=5  &view=side|top|front  &big=1 (one model, 1 mm detail)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.autoClear = false;
document.body.appendChild(r.domElement);
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const man = await (await fetch('/public/assets/weapons/manifest.json?' + Date.now())).json();
const keys = (q.get('keys') || Object.keys(man.models).join(',')).split(',').filter((k) => man.models[k]);
const cols = +(q.get('cols') || Math.min(5, keys.length)), rows = Math.ceil(keys.length / cols);
const tw = Math.floor(W / cols), th = Math.floor(H / rows);
const view = q.get('view') || 'side';
const gl = new GLTFLoader();
const tiles = [];
function gridLines(lo, hi, step, color, y0) {
  const pts = [];
  for (let z = Math.floor(lo.z / step) * step; z <= hi.z; z += step) pts.push(0, lo.y, z, 0, hi.y, z);
  for (let y = Math.floor(lo.y / step) * step; y <= hi.y; y += step) pts.push(0, y, lo.z, 0, y, hi.z);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35, depthTest: false }));
}
function dot(p, color, s) { const m = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8), new THREE.MeshBasicMaterial({ color, depthTest: false })); m.position.set(p[0], p[1], p[2]); m.renderOrder = 9; return m; }
for (let i = 0; i < keys.length; i++) {
  const k = keys[i], M = man.models[k];
  const scene = new THREE.Scene(); scene.background = new THREE.Color(i % 2 ? 0x1b1f24 : 0x1e2228); scene.environment = env;
  const sun = new THREE.DirectionalLight(0xfff2e0, 2.0); sun.position.set(3, 4, 1); scene.add(sun);
  const g = (await gl.loadAsync('/public/assets/weapons/' + k + '.glb?' + Date.now())).scene; scene.add(g);
  const lo = new THREE.Vector3(...M.bbox.min), hi = new THREE.Vector3(...M.bbox.max);
  const pad = 0.03; const L = new THREE.Vector3(lo.x - pad, lo.y - pad, lo.z - pad), Hh = new THREE.Vector3(hi.x + pad, hi.y + pad, hi.z + pad);
  const small = (hi.z - lo.z) < 0.5;
  scene.add(gridLines(L, Hh, small ? 0.01 : 0.05, 0x5a6470)); scene.add(gridLines(L, Hh, small ? 0.05 : 0.1, 0x9aa4b0));
  const s = small ? 0.004 : 0.008, P = M.points;
  scene.add(dot([0, 0, 0], 0x30ff60, s));
  if (P.muzzle) scene.add(dot(P.muzzle, 0xff3030, s)); if (P.lgrip) scene.add(dot(P.lgrip, 0x3080ff, s)); if (P.sight) scene.add(dot(P.sight, 0xffe030, s)); if (P.eject) scene.add(dot(P.eject, 0x30e0ff, s));
  const aspect = tw / th, cz = (lo.z + hi.z) / 2, cy = (lo.y + hi.y) / 2;
  let hw = (hi.z - lo.z) / 2 + pad * 1.5, hh = (hi.y - lo.y) / 2 + pad * 1.5; if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
  const cam = new THREE.OrthographicCamera(-hw, hw, hh + hh * 0.12, -hh, 0.01, 10);
  if (view === 'side') { cam.position.set(2, cy, cz); cam.up.set(0, 1, 0); cam.lookAt(0, cy, cz); }
  else if (view === 'top') { cam.position.set(0, 2, cz); cam.up.set(-1, 0, 0); cam.lookAt(0, 0, cz); }
  else { cam.position.set(0, cy, 3); cam.lookAt(0, cy, 0); }
  tiles.push({ scene, cam, x: (i % cols) * tw, y: Math.floor(i / cols) * th, k, M });
  // axis labels (cm, model coords: z forward = left on screen, y up) at every major line
  if (view === 'side') {
    const st = small ? 0.02 : 0.1, T = tiles.at(-1);
    const proj = (y, z) => { const v = new THREE.Vector3(0, y, z); cam.updateMatrixWorld(); cam.updateProjectionMatrix(); v.project(cam); return [T.x + (v.x * 0.5 + 0.5) * tw, T.y + (-v.y * 0.5 + 0.5) * th]; };
    const lab = (txt, x, y, c) => { const e = document.createElement('div'); e.className = 't'; e.style.cssText += `left:${x}px;top:${y}px;font-size:10px;color:${c}`; e.textContent = txt; document.body.appendChild(e); };
    for (let z = Math.ceil(L.z / st) * st; z <= Hh.z; z += st) { const [x, y] = proj(Hh.y, z); lab(Math.round(z * 100), x - 6, y - 14, '#ffd27a'); }
    for (let y = Math.ceil(L.y / st) * st; y <= Hh.y; y += st) { const [x, yy] = proj(y, Hh.z); lab(Math.round(y * 100), x - 22, yy - 6, '#9fd0ff'); }
    for (const [nm, c] of [['p1', 0xff00ff], ['p2', 0xffffff], ['p3', 0xff9900]]) { const v = q.get(k + '.' + nm); if (v) scene.add(dot(v.split(':').map(Number), c, s)); }
  }
  const el = document.createElement('div'); el.className = 't'; el.style.left = (tiles.at(-1).x + 6) + 'px'; el.style.top = (tiles.at(-1).y + 4) + 'px';
  el.textContent = `${k}  ${((hi.z - lo.z) * 100).toFixed(1)} cm  ${M.tris} tris  ${(M.bytes / 1024) | 0} KB  grid ${small ? '1/5' : '5/10'} cm`; document.body.appendChild(el);
}
r.clear();
for (const t of tiles) { r.setViewport(t.x, H - t.y - th, tw, th); r.setScissor(t.x, H - t.y - th, tw, th); r.setScissorTest(true); r.render(t.scene, t.cam); }
window.__ready = true;
</script></body></html>

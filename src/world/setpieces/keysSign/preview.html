<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Keys welcome sign preview</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style></head><body>
<script>addEventListener("error",e=>{window.err=(e.message||"")+" "+(e.filename||"")+":"+e.lineno});addEventListener("unhandledrejection",e=>{window.err=String(e.reason&&e.reason.stack||e.reason)});</script>
<script type="module">
import * as THREE from 'three';
import { buildKeysSign, loadKeysSignTextures } from './keysSign.js';
const q = new URLSearchParams(location.search), T = q.get('t') || 'noon', cam = q.get('cam') || 'driver';
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(q.get('fov') ? +q.get('fov') : 40, innerWidth / innerHeight, 0.1, 3000);
const SKY = { morning: { top: 0x8fb4cc, hor: 0xf3d9b8, sun: [0.75, 0.22, 0.62], sunC: 0xffc98a, sunI: 2.6, hemi: 0.9, fog: 0.011, exp: 1.0 }, noon: { top: 0x3f86d6, hor: 0xcfe3f2, sun: [-0.35, 0.86, 0.5], sunC: 0xfff4e0, sunI: 3.4, hemi: 1.0, fog: 0.0022, exp: 0.95 }, night: { top: 0x04070f, hor: 0x141c2c, sun: [0.3, 0.7, -0.4], sunC: 0x7088b8, sunI: 0.12, hemi: 0.1, fog: 0.004, exp: 1.0 } }[T];
renderer.toneMappingExposure = SKY.exp;
const skyGeo = new THREE.SphereGeometry(2000, 32, 16), col = [], ct = new THREE.Color(SKY.top), ch = new THREE.Color(SKY.hor), cc = new THREE.Color();
for (let i = 0; i < skyGeo.attributes.position.count; i++) { const y = skyGeo.attributes.position.getY(i) / 2000; cc.copy(ch).lerp(ct, Math.pow(Math.max(0, y), 0.45)); col.push(cc.r, cc.g, cc.b); }
skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })); scene.add(sky);
{ const es = new THREE.Scene(); es.add(sky.clone()); const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.02).texture; scene.environmentIntensity = T === 'night' ? 0.25 : 0.9; }
scene.fog = new THREE.FogExp2(SKY.hor, SKY.fog);
const sun = new THREE.DirectionalLight(SKY.sunC, SKY.sunI); sun.position.set(...SKY.sun).multiplyScalar(60); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 200 }); sun.shadow.bias = -0.0004; scene.add(sun);
scene.add(new THREE.HemisphereLight(SKY.top, 0x6a6048, SKY.hemi));
// ground: sandy scrub + a two-lane road on the -X side
const mkTex = (fn, rep) => { const c = document.createElement('canvas'); c.width = c.height = 512; fn(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; return t; };
const speck = (x, base, n, cols) => { x.fillStyle = base; x.fillRect(0, 0, 512, 512); for (let i = 0; i < n; i++) { x.fillStyle = cols[i % cols.length]; x.globalAlpha = 0.25 + Math.random() * 0.5; x.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 3, 1 + Math.random() * 3); } x.globalAlpha = 1; };
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ map: mkTex((x) => speck(x, '#8f9368', 9000, ['#6f7a4a', '#b9b08a', '#55683c', '#c9c2a0']), [180, 180]), roughness: 1 })); gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; scene.add(gnd);
const road = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 900), new THREE.MeshStandardMaterial({ map: mkTex((x) => { speck(x, '#4a4b4c', 12000, ['#3c3d3e', '#5d5e5e', '#6a6966', '#343536']); x.fillStyle = '#d9c45a'; x.fillRect(250, 0, 5, 512); x.fillRect(259, 0, 5, 512); x.fillStyle = '#e6e6e0'; x.fillRect(14, 0, 7, 512); x.fillRect(492, 0, 7, 512); }, [1, 60]), roughness: 0.9 })); road.rotation.x = -Math.PI / 2; road.position.set(-9.9, 0.01, 0); road.receiveShadow = true; scene.add(road);
const textures = await loadKeysSignTextures(THREE);
const ks = buildKeysSign(THREE, { textures }); scene.add(ks.group);
ks.group.traverse((o) => { if (o.isMesh) { o.castShadow = o.castShadow ?? true; } });
if (T === 'night') for (const l of ks.lights) { const s = new THREE.SpotLight(l.color, 130, 16, 0.95, 0.6, 1.6); s.position.copy(l.position); s.target.position.copy(l.target); scene.add(s, s.target); }
const CAMS = { driver: [[-8.0, 1.25, 26], [-0.6, 3.6, 0]], close: [[-3.2, 2.4, 9.5], [0, 3.9, 0]], face: [[-2.6, 3.9, 9.6], [0, 3.9, 0]], detail: [[0.6, 4.0, 3.2], [1.5, 4.1, 0]], back: [[5, 2, -14], [0, 4, 0]], wide: [[-16, 5, 30], [2, 4, -4]], bed: [[-2.5, 1.3, 7], [1, 1.2, 0]] };
const [cp, ctg] = q.get('pos') ? [q.get('pos').split(',').map(Number), q.get('look').split(',').map(Number)] : CAMS[cam];
camera.position.set(...cp); camera.lookAt(...ctg);
window.ks = ks; window.THREE = THREE; window.camera = camera;
let last = performance.now(), frames = 0;
function loop() { const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; ks.update(dt, { night: T === 'night' ? 1 : 0, playerLocal: window.playerLocal || null }); renderer.render(scene, camera); if (++frames === 4) { window.info = renderer.info.render; window.ready = true; } requestAnimationFrame(loop); }
loop();
</script></body></html>

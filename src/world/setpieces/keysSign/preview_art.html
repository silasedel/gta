<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Keys sign art preview</title>
<style>body{margin:0;background:#3a4046}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>addEventListener("error",e=>{window.err=(e.message||"")+" "+(e.filename||"")+":"+e.lineno});addEventListener("unhandledrejection",e=>{window.err=String(e.reason&&e.reason.stack||e.reason)});</script>
<script type="module">
const q = new URLSearchParams(location.search);
const which = q.get('art') || 'welcome', w = +(q.get('w') || 2048), show = q.get('show') || 'color', zoom = q.get('zoom');
const t0 = performance.now();
let out;
if (which === 'welcome') out = (await import('./art.js')).paintKeysWelcome({ width: w, weather: +(q.get('weather') ?? 1) });
else if (which === 'back') out = (await import('./art.js')).paintKeysBack({ width: w });
window.paintMs = performance.now() - t0;
const cv = document.getElementById('c'), VW = innerWidth, VH = innerHeight; cv.width = VW; cv.height = VH;
const x = cv.getContext('2d'); x.fillStyle = '#3a4046'; x.fillRect(0, 0, VW, VH);
let src = show === 'normal' ? out.normal : show === 'orm' ? out.orm : out.colorCut || out.color;
if (show === 'lit') {
  const W = out.width, H = out.height, a = out.colorCut.getContext('2d').getImageData(0, 0, W, H), n = out.normal.getContext('2d').getImageData(0, 0, W, H).data, d = a.data;
  const L = [-0.5, 0.62, 0.6], ll = Math.hypot(...L); for (let i = 0; i < d.length; i += 4) { const nx = n[i] / 127.5 - 1, ny = n[i + 1] / 127.5 - 1, nz = n[i + 2] / 127.5 - 1; const k = 0.35 + 1.0 * Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2]) / ll); d[i] *= k; d[i + 1] *= k; d[i + 2] *= k; }
  src = document.createElement('canvas'); src.width = W; src.height = H; src.getContext('2d').putImageData(a, 0, 0);
}
if (zoom) { const [zx, zy, zw] = zoom.split(',').map(Number), s = out.width / (out.design?.w || 1600); x.drawImage(src, zx * s, zy * s, zw * s, zw * s * VH / VW, 0, 0, VW, VH); }
else { const s = Math.min(VW / src.width, VH / src.height); x.drawImage(src, (VW - src.width * s) / 2, (VH - src.height * s) / 2, src.width * s, src.height * s); }
window.out = out; window.ready = true;
</script></body></html>

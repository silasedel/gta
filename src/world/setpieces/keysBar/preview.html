<!doctype html>
<html><head><meta charset="utf-8"><title>Low Tide Lola's: preview</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1118;font:12px/1.4 ui-monospace,Menlo,monospace;color:#e9f1f5}canvas{display:block}
#ui{position:fixed;left:8px;top:8px;background:#000a;padding:8px 10px;border-radius:8px}#info{white-space:pre;margin-top:6px;color:#bfe}.hide #ui{display:none}</style></head>
<body><div id="ui"><label>time <input id="tod" type="range" min="0" max="24" step="0.05" value="15" style="width:180px;vertical-align:middle"> <span id="todv"></span></label>
 <label>view <select id="view"></select></label><div id="info">loading...</div></div>
<script type="module">
// Standalone preview for the Keys bar set piece (track: keys-bar). Sky, sun, ground, orbit camera, time-of-day slider.
// URL: ?t=15&view=hero|front|porch|night|top|back | &cam=x,y,z&look=x,y,z&fov=45 | &ui=0 | &anchors=1 | &col=1 | &design=0
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { buildKeysBar } from './keysBar.js';
import { createFootprints } from '../../../fx/footprints.v2.js';
const q = new URLSearchParams(location.search), num = (k, d) => (q.get(k) ?? d).split(',').map(Number);
if (q.get('ui') === '0') document.body.classList.add('hide');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Number(q.get('pr') || 1)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(Number(q.get('fov') || 45), innerWidth / innerHeight, 0.1, 4000);
const sky = new Sky(); sky.scale.setScalar(3000); scene.add(sky);
const sun = new THREE.DirectionalLight(0xffffff, 4); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 220 }); sun.shadow.camera.updateProjectionMatrix(); scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x9a8a6a, 0.6); scene.add(hemi);
const pmrem = new THREE.PMREMGenerator(renderer), envScene = new THREE.Scene(), sky2 = new Sky(); sky2.scale.setScalar(1000); envScene.add(sky2); let envRT = null;
let design = null;
if (q.get('design') !== '0') { try { design = (await import('../../../design/index.js')).default; design.setAssetBase?.('/assets/design/'); await Promise.race([design.ready(), new Promise((r) => setTimeout(r, 6000))]); } catch (e) { console.warn('design system not loaded', e); design = null; } }
let tod = Number(q.get('t') || 15);
const bar = buildKeysBar(THREE, { design, timeOfDay: tod, anisotropy: renderer.capabilities.getMaxAnisotropy() }); window.bar = bar; scene.add(bar.group);
// preview-only surroundings: sandy scrub ground and a strip of highway in front (the game supplies the real ones)
{ const tl = new THREE.TextureLoader(), T = (n, r, s) => { const t = tl.load('/assets/city/pbr/' + n + '.jpg'); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(r, s ?? r); if (/_col/.test(n)) t.colorSpace = THREE.SRGBColorSpace; return t; };
  const g = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ normalMap: T('coast_sand_01_nrm', 260), roughness: 1, color: 0xcfc6a4 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(900, 9), new THREE.MeshStandardMaterial({ map: T('asphalt_04_col', 150, 1.5), normalMap: T('asphalt_04_nrm', 150, 1.5), roughness: 0.9 })); road.rotation.x = -Math.PI / 2; road.position.set(0, 0.02, 25); road.receiveShadow = true; scene.add(road);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(900, 0.28), new THREE.MeshStandardMaterial({ color: 0xe8c02a, roughness: 0.8 })); line.rotation.x = -Math.PI / 2; line.position.set(0, 0.03, 25); scene.add(line); }
const live = bar.lights.map((l) => { const pl = l.kind === 'sign_flood' ? new THREE.SpotLight(l.color, 0, 14, 0.9, 0.6, 1.5) : new THREE.PointLight(l.color, 0, l.range, 1.7); pl.position.set(...l.pos); if (l.target) { pl.target.position.set(...l.target); scene.add(pl.target); } pl.userData.d = l; scene.add(pl); return pl; });
const sunDir = new THREE.Vector3();
function setTime(h) { tod = ((h % 24) + 24) % 24; const a = (tod - 6.4) / 12.4 * Math.PI, day = tod > 6.4 && tod < 18.8, el = day ? Math.sin(a) * 1.15 : -0.35;
  sunDir.set(Math.cos(a) * Math.cos(el) * 0.8 - 0.25, Math.sin(el), 0.55 * Math.cos(el) + 0.15).normalize(); const k = THREE.MathUtils.smoothstep(sunDir.y, -0.04, 0.22), low = 1 - THREE.MathUtils.smoothstep(sunDir.y, 0.05, 0.5), night = !day || sunDir.y < 0.02;
  for (const s of [sky, sky2]) { const u = s.material.uniforms; u.sunPosition.value.copy(night ? new THREE.Vector3(0.2, -0.3, 0.5) : sunDir); u.turbidity.value = 4 + 5 * low; u.rayleigh.value = 1.5 + 1.6 * low; u.mieCoefficient.value = 0.006; u.mieDirectionalG.value = 0.82; }
  if (night) { sun.position.set(-40, 70, 30); sun.color.set(0x9db8ff); sun.intensity = 0.35; hemi.intensity = 0.14; hemi.color.set(0x5f7fb8); hemi.groundColor.set(0x1b2230); } else { sun.position.copy(sunDir).multiplyScalar(110); sun.color.setHSL(0.09 + 0.03 * k, 0.55 * low + 0.1, 0.5 + 0.46 * k * (1 - 0.25 * low)); sun.intensity = 4.6 * k * (1 - 0.3 * low) + 0.02; hemi.intensity = 0.25 + 0.55 * k; hemi.color.set(0xbfd9ff); hemi.groundColor.set(0x9a8a6a); }
  sky.visible = !night; scene.background = night ? new THREE.Color(0x060a14) : null; renderer.toneMappingExposure = night ? 0.62 : 0.42 + 0.1 * low;
  if (envRT) envRT.dispose(); envRT = pmrem.fromScene(envScene, 0.02); scene.environment = envRT.texture; scene.environmentIntensity = night ? 4 : 0.85;
  bar.update(0, { timeOfDay: tod, night: night ? 1 : low > 0.85 ? 0.6 : 0 }); for (const pl of live) pl.intensity = (night ? 1 : low > 0.85 ? 0.5 : 0) * pl.userData.d.intensity * (pl.isSpotLight ? 0.9 : 1);
  document.getElementById('tod').value = tod; document.getElementById('todv').textContent = `${String(Math.floor(tod)).padStart(2, '0')}:${String(Math.floor((tod % 1) * 60)).padStart(2, '0')}`; }
window.setTime = setTime; document.getElementById('tod').oninput = (e) => setTime(Number(e.target.value));
const VIEWS = { hero: { cam: [-13.5, 2.1, 13.5], look: [0.5, 2.6, 0.5], fov: 42 }, front: { cam: [1, 3.2, 27], look: [1, 2.6, 0], fov: 40 }, porch: { cam: [-6.2, 2.1, 4.6], look: [-1.6, 1.75, -0.6], fov: 50 }, night: { cam: [-10.5, 2.0, 15.5], look: [0.5, 2.5, 0.5], fov: 44 }, top: { cam: [0, 42, 22], look: [0, 0, 2], fov: 45 }, back: { cam: [14, 5, -16], look: [0, 2, -3], fov: 45 }, yard: { cam: [6, 1.7, 14], look: [-3, 1.2, 4], fov: 50 }, bar: { cam: [-2.2, 2.2, 2.0], look: [-2.2, 1.9, -3], fov: 55 }, table: { cam: [-5.9, 1.75, 7.3], look: [-7.2, 0.75, 6.0], fov: 42 }, table2: { cam: [-1.2, 1.7, 10.2], look: [-2.6, 0.75, 8.8], fov: 42 }, flag: { cam: [-3.4, 5.0, 6.4], look: [-5.3, 5.05, 2.3], fov: 26 }, prints: { cam: [0.9, 0.75, 9.6], look: [-0.5, 0.04, 7.6], fov: 42 }, sand: { cam: [5.2, 0.55, 12.6], look: [4.4, 0.04, 11.6], fov: 40 } };
const controls = new OrbitControls(camera, renderer.domElement);
function setView(n) { const v = VIEWS[n] || VIEWS.hero; camera.position.set(...v.cam); controls.target.set(...v.look); camera.fov = v.fov; camera.updateProjectionMatrix(); controls.update(); }
window.setView = setView; const sel = document.getElementById('view'); for (const k in VIEWS) sel.add(new Option(k, k)); sel.onchange = () => setView(sel.value);
setView(q.get('view') || 'hero'); if (q.get('cam')) { camera.position.set(...num('cam')); controls.target.set(...num('look', '0,2,0')); controls.update(); }
if (q.get('anchors')) { const mk = (a, c) => { const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, a.seat ? 0.7 : 1.25, 4, 8), new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 })); m.position.set(a.pos[0], a.pos[1] + (a.seat ? 0.35 : 0.85), a.pos[2]); const n = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.3, 6), new THREE.MeshBasicMaterial({ color: 0x111111 })); n.rotation.x = Math.PI / 2; n.position.set(Math.sin(a.heading) * 0.3, 0.5, Math.cos(a.heading) * 0.3); m.add(n); scene.add(m); }; bar.anchors.patrons.forEach((a) => mk(a, 0x4aa3ff)); bar.anchors.staff.forEach((a) => mk(a, 0xff7a4a)); }
if (q.get('col')) { const mm = new THREE.MeshBasicMaterial({ color: 0x00ffaa, wireframe: true }); for (const c of bar.colliders) { const m = new THREE.Mesh(c.type === 'box' ? new THREE.BoxGeometry(c.hx * 2, c.hy * 2, c.hz * 2) : new THREE.CylinderGeometry(c.r, c.r, c.hh * 2, 10), mm); m.position.set(c.x, c.y, c.z); m.rotation.y = c.ry || 0; scene.add(m); } }
setTime(tod); await bar.ready; setTime(tod);
// footprint demo (?prints=1): an older walking trail, a fresh walking trail and a running trail across the lot
let fp = null, fpT = 0;
if (q.get('prints')) { fp = createFootprints(THREE, {}); scene.add(fp.mesh); window.fp = fp;
  const trail = (x0, z0, x1, z1, stride, run) => { const d = Math.hypot(x1 - x0, z1 - z0), yaw = Math.atan2(x1 - x0, z1 - z0), n = Math.floor(d / stride); for (let i = 0; i <= n; i++) { const t = i / n, left = i % 2 === 0, off = left ? -0.105 : 0.105; fp.add(x0 + (x1 - x0) * t + Math.cos(yaw) * off, 0.054, z0 + (z1 - z0) * t - Math.sin(yaw) * off, yaw + (left ? 0.1 : -0.1), { left, depth: run ? 1 : 0.66 }); } };
  fp.update(0); trail(-3.2, 9.6, 1.6, 6.9, 0.7, false); fp.update(130); trail(1.4, 10.4, -1.9, 6.0, 0.7, false); trail(-2.6, 7.1, 2.2, 8.4, 1.15, true); fpT = 136; }
let last = performance.now(); function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; bar.update(dt, { timeOfDay: tod, night: bar.night }); if (fp) fp.update(fpT, camera.position, sunDir, tod > 6.6 && tod < 18.6 ? 1 : 0.1); controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame); } requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const st = bar.stats(); window.stats = () => ({ ...bar.stats(), rendererCalls: renderer.info.render.calls, rendererTris: renderer.info.render.triangles });
document.getElementById('info').textContent = `${bar.name}\ntriangles ${st.triangles}  meshes ${st.drawCalls}\ncolliders ${st.colliders}  patrons ${st.patrons}  staff ${st.staff}  lights ${st.lights}\nbrands ${bar.brandsUsed.join(', ') || '(design system not loaded)'}`;
setTimeout(() => { window.ready = true; }, 600);
</script></body></html>

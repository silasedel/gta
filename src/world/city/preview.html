<!doctype html>
<html><head><meta charset="utf-8"><title>city preview</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}#i{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;background:#0008;padding:4px}</style></head>
<body><div id="i"></div><script type="module">
import * as THREE from 'three';
import RAPIER from '@dimforge/rapier3d-compat';
const modName = new URLSearchParams(location.search).get('mod');
const { createCity } = await import(modName ? './_staging.js' : '../city.js');
await RAPIER.init();
const q = new URLSearchParams(location.search);
const v = (k, d) => (q.get(k) || d).split(',').map(Number);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 6000);
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
const game = { THREE, RAPIER, renderer, scene, camera, world, updaters: [], fixedHooks: [], clock: { elapsed: 0, dt: 0 }, timeOfDay: Number(q.get('t') || 17.5),
  player: { position: new THREE.Vector3(...v('cam', '560,160,-260')) } };
window.game = game;
let env = null;
try { const m = await import('../environment.js'); env = await m.createEnvironment(game); } catch (e) {
  console.warn('env failed', e);
  scene.background = new THREE.Color(0x88aacc);
  const s = new THREE.DirectionalLight(0xffe0c0, 3); s.position.set(-200, 300, 100); scene.add(s, new THREE.HemisphereLight(0xbfd8ff, 0x806040, 1));
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
}
const t0 = performance.now();
const city = await createCity(game);
window.city = city;
const ms = (performance.now() - t0) | 0;
camera.position.set(...v('cam', '560,160,-260')); camera.lookAt(...v('look', '250,0,30'));
let last = performance.now(), frames = 0, acc = 0;
function loop() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  game.clock.dt = dt; game.clock.elapsed += dt;
  game.player.position.copy(camera.position);
  env?.update?.(dt); for (const u of game.updaters) u(dt);
  renderer.render(scene, camera);
  frames++; acc += dt; if (acc > 1) { document.getElementById('i').textContent = `build ${ms}ms  fps ${(frames / acc).toFixed(0)}  calls ${renderer.info.render.calls} tris ${(renderer.info.render.triangles / 1e6).toFixed(2)}M  t=${game.timeOfDay}`; frames = 0; acc = 0; }
  requestAnimationFrame(loop);
}
loop();
</script></body></html>

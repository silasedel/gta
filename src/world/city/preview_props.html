<!doctype html>
<html><head><meta charset="utf-8"><title>city-look: prop surfaces</title></head>
<body><script type="module">
import * as THREE from 'three';
import { createLab } from './lab.js';
import { createPropMaterial, mergeProp, SURF } from './propmat.js';
const lab = await createLab({ cam: '0,5,15', look: '0,1.2,0' });
const shared = { uEmis: { value: 1 } };
const mat = await createPropMaterial(lab.renderer, shared);
const names = Object.keys(SURF), parts = [];
const tints = [0x2f6fb0, 0xffffff, 0xffffff, 0xffffff, 0xffffff, 0xf0d8b0, 0x3d8f5a, 0xffffff, 0xffffff, 0xffffff, 0xd83a2a, 0xffffff, 0xffffff, 0x9fd0e0, 0xffffff, 0xffffff];
names.forEach((n, i) => {
  const x = (i % 8 - 3.5) * 2.2, z = i < 8 ? 0 : 4.5;
  parts.push({ g: new THREE.SphereGeometry(0.7, 32, 20), m: new THREE.Matrix4().makeTranslation(x, 2.4, z), surf: SURF[n], color: tints[i] });
  parts.push({ g: new THREE.BoxGeometry(1.3, 1.3, 1.3), m: new THREE.Matrix4().makeTranslation(x, 0.65, z), surf: SURF[n], color: tints[i] });
  parts.push({ g: new THREE.CylinderGeometry(0.08, 0.08, 0.5, 8), m: new THREE.Matrix4().makeTranslation(x, 3.4, z), surf: SURF.plastic, color: 0xffd9a0, emis: 1 });
});
const mesh = new THREE.Mesh(mergeProp(parts), mat); mesh.castShadow = mesh.receiveShadow = true; lab.scene.add(mesh);
lab.start();
</script></body></html>

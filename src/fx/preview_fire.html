<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fire preview (playtest-fixes)</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<script type="module">
// Standalone fire check: ?mode=car|explode|night  &t=<seconds to simulate before the shot>
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createFireSystem } from './fire.js';

const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'car';
const night = mode === 'night';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x0a1020 : 0x9fc3e0);
scene.fog = new THREE.Fog(scene.background, 60, 220);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(7.5, 2.4, 9.5);
camera.lookAt(0, 1.6, 0);
scene.add(new THREE.HemisphereLight(night ? 0x334466 : 0xdfeeff, 0x554433, night ? 0.25 : 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, night ? 0.05 : 2.2);
sun.position.set(20, 30, 10);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.92 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
// a burnt-out car shell stand-in for scale (dark, charred)
const car = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.75, 4.4), new THREE.MeshStandardMaterial({ color: 0x1d1a18, roughness: 0.8, metalness: 0.4 }));
body.position.y = 0.65;
const cab = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 2.2), body.material);
cab.position.set(0, 1.3, -0.3);
car.add(body, cab);
if (mode !== 'explode') scene.add(car);
const fire = createFireSystem(THREE, scene, { wind: () => ({ dir: { x: 1, y: 0.2 }, speed: 0.6 }), dayLight: () => (night ? 0.1 : 1), viewportHeight: () => innerHeight });
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.5, 0.9));
composer.addPass(new OutputPass());
const pos = new THREE.Vector3(0, 0.95, 1.4);
const simT = Number(q.get('t') || 3);
const dt = 1 / 60;
let boomed = false;
function step(t) {
  if (mode === 'explode') {
    if (!boomed && t > 0.2) {
      fire.explode(new THREE.Vector3(0, 0, 0), 7.5);
      boomed = true;
    }
  } else {
    fire.burn('car', pos, 1.2);
  }
  fire.update(dt, camera);
}
for (let t = 0; t < simT; t += dt) {
  step(t);
}
let t = simT;
function loop() {
  step(t);
  t += dt;
  composer.render();
  requestAnimationFrame(loop);
}
composer.render();
window.ready = true;
if (!q.has('freeze')) {
  loop();
}
</script>
</body>
</html>

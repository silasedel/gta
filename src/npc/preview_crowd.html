<!doctype html><html><head><meta charset="utf-8"><title>NPC crowd preview</title><style>html,body{margin:0;overflow:hidden;background:#9db8c9}</style></head><body>
<script type="module">
// preview_crowd.html?n=200&pose=-1&cam=close|wide|row  : instanced crowd bodies with seeded looks (no game needed)
import * as THREE from 'three';
import { createCrowd, POSE } from './crowd.js';
import { rng } from './rand.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9db8c9);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x8a7f6a, 1.0)); const sun = new THREE.DirectionalLight(0xfff2dd, 2.6); sun.position.set(8, 14, 6); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xb9b4a8, roughness: 0.95 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const crowd = createCrowd({ scene }, { max: 1200, scene });
const N = +(q.get('n') || 120), fixedPose = +(q.get('pose') ?? -1), cam = q.get('cam') || 'close';
const r = rng(+(q.get('seed') || 5));
const SKIN = [0xf1d3bd, 0xe6bd9d, 0xd2a27c, 0xb98360, 0x9a6a48, 0x7a5136, 0x5c3b27, 0x452b1d];
const HAIR = [0x120d0a, 0x2a1d14, 0x4f3622, 0x8a6a3e, 0xb5b0a6, 0x9b5a2e, 0xd8c08a];
const COL = [0xe07f68, 0x2f8a86, 0xf0ede6, 0xe8d78a, 0x9cc1de, 0x2a3442, 0x1f1f21, 0xb5443e, 0x5a6450, 0xd95f9a, 0xb5a385, 0x5d7598, 0xffffff];
const poses = Object.values(POSE); const cols = cam === 'row' ? N : Math.ceil(Math.sqrt(N * 1.6));
for (let i = 0; i < N; i++) {
  const s = crowd.alloc(); const f = r.chance(0.5);
  crowd.setLook(s, { skin: r.pick(SKIN), top: r.pick(COL), bottom: r.pick(COL), hair: r.pick(HAIR), shoes: r.pick([0xf0f0f0, 0x222222, 0x6c4a2e, 0xc0392b]), hat: r.pick(COL),
    sleeve: r.pick([-1, 0, 0.3, 0.35, 0.5, 1]), leg: r.pick([0.14, 0.3, 0.42, 0.6, 1, 1]), hairStyle: f ? r.pick([2, 3, 3, 4, 4, 5, 1]) : r.pick([0, 1, 1, 1, 5, 6, 3]), hatKind: r.chance(0.3) ? r.int(1, 4) : 0,
    girth: r.range(0.82, 1.5), shoulders: f ? r.range(0.86, 0.98) : r.range(0.96, 1.14), hips: f ? r.range(1.0, 1.2) : r.range(0.92, 1.05), bust: f ? r.range(0.5, 1.2) : 0 });
  const pose = fixedPose >= 0 ? fixedPose : poses[i % poses.length];
  crowd.setPose(s, pose, pose === 1 || pose === 13 || pose === 22 ? 6 : pose === 2 || pose === 21 ? 10 : 2.2, r() * 6.28, 1);
  const x = ((i % cols) - (cols - 1) / 2) * 1.3, z = (Math.floor(i / cols)) * -1.9;
  crowd.setTransform(s, x, 0, z, 0.25 * (r() - 0.5), r.range(1.5, 1.95), pose === 5 || pose === 17 || pose === 27 ? 1.5 : 1);
}
const camera = new THREE.PerspectiveCamera(cam === 'wide' ? 50 : 30, innerWidth / innerHeight, 0.1, 500);
if (cam === 'wide') { camera.position.set(0, 6, 22); camera.lookAt(0, 1, -10); } else if (cam === 'row') { camera.position.set(0, 1.6, 2 + N * 0.75); camera.lookAt(0, 0.9, 0); } else { camera.position.set(3, 2.4, 9.5); camera.lookAt(0, 0.9, -3); }
if (q.get('cx')) { camera.position.set(+q.get('cx'), +q.get('cy'), +q.get('cz')); camera.lookAt(+(q.get('tx') || 0), +(q.get('ty') || 0.9), +(q.get('tz') || 0)); }
let t = +(q.get('t') || 0.7), frames = 0; crowd.update(t);
function loop() { if (q.get('anim')) { crowd.update(1 / 60); } renderer.render(scene, camera); frames++; if (frames === 3) { window.stats = { tris: crowd.tris, active: crowd.active, calls: renderer.info.render.calls, sceneTris: renderer.info.render.triangles }; window.ready = true; } requestAnimationFrame(loop); }
loop();
</script></body></html>

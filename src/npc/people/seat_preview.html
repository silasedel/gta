<!doctype html><html><head><meta charset="utf-8"><title>Seat preview</title>
<style>html,body{margin:0;overflow:hidden;background:#000}</style></head><body>
<script type="module">
// Seat solver bench (src/npc/seat.js) without the game: a mock car shell with a seat anchor (hip, heel, wheel, roofY,
// doorX), a cushion, backrest, floor, roof plane and steering wheel, and one of the user's people seated as driver or
// passenger.  seat_preview.html?ids=p07&role=driver|passenger&car=sedan|truck|low&cam=side|front|top|hand&steer=0
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadPerson, personMaterial } from './lib.js';
import { createNpc } from '../arch/character.js';
import { seatCharacter } from '../seat.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9c3d6);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x8a7a66, 0.8)); const sun = new THREE.DirectionalLight(0xfff1dc, 2.2); sun.position.set(4, 7, 5); scene.add(sun);
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 35), innerWidth / innerHeight, 0.02, 100);
const game = { scene, camera, renderer, clock: { elapsed: 0 } };
const CARS = {
  sedan: { hip: [0.37, 0.52, -0.25], heel: [0.37, 0.17, 0.62], roofY: 1.38, doorX: 0.74, wheel: { c: [0.37, 0.88, 0.16], r: 0.19, tilt: 0.42 } },
  truck: { hip: [0.42, 1.0, 0.1], heel: [0.42, 0.55, 0.85], roofY: 1.92, doorX: 0.82, wheel: { c: [0.42, 1.37, 0.6], r: 0.2, tilt: 0.5 } },
  low: { hip: [0.38, 0.36, -0.4], heel: [0.38, 0.12, 0.55], roofY: 1.1, doorX: 0.72, wheel: { c: [0.38, 0.68, 0.12], r: 0.18, tilt: 0.55 } },
};
const C = CARS[q.get('car') || 'sedan'];
const role = q.get('role') || 'driver';
const shell = new THREE.Group(); scene.add(shell); shell.rotation.y = +(q.get('yaw') || 0);
const hip = new THREE.Vector3().fromArray(C.hip); if (role !== 'driver') hip.x = -hip.x;
const heel = new THREE.Vector3().fromArray(C.heel); if (role !== 'driver') heel.x = -heel.x;
const anchor = { id: role === 'driver' ? 'driver' : 'front', i: role === 'driver' ? 0 : 1, side: Math.sign(hip.x), yaw: 0, hip, heel, roofY: C.roofY, doorX: C.doorX,
  wheel: role === 'driver' ? { c: new THREE.Vector3().fromArray(C.wheel.c), r: C.wheel.r, tilt: C.wheel.tilt } : null };
// mock interior
const M = (c, o = 1) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, transparent: o < 1, opacity: o });
const box = (w, h, d, x, y, z, m, rx = 0) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.rotation.x = rx; shell.add(b); return b; };
box(0.5, 0.12, 0.5, hip.x, hip.y - 0.15, hip.z + 0.12, M(0x5a4636));                          // cushion
box(0.5, 0.7, 0.1, hip.x, hip.y + 0.25, hip.z - 0.2, M(0x5a4636), -0.32);                     // backrest
box(1.6, 0.02, 2.6, 0, heel.y - 0.01, 0, M(0x333333));                                         // floor
box(1.6, 0.01, 1.6, 0, C.roofY + 0.005, hip.z, M(0x99aabb, 0.25));                             // roof liner
box(0.02, 0.6, 1.6, Math.sign(hip.x) * C.doorX, hip.y + 0.2, hip.z, M(0x999999, 0.2));          // door panel
if (anchor.wheel) { const w = new THREE.Mesh(new THREE.TorusGeometry(anchor.wheel.r, 0.017, 10, 40), M(0x111111)); w.position.copy(anchor.wheel.c); w.rotation.x = -(anchor.wheel.tilt); w.rotation.y = 0; shell.add(w); w.rotation.set(anchor.wheel.tilt, 0, 0); }
const base = await loadPerson(q.get('ids') || 'p07');
const ch = createNpc(game, { base, seed: 3, vary: 0, personMaterial, scale: 1 });
ch._applyLOD(0, true);
shell.add(ch.root);
const veh = { steerCur: +(q.get('steer') || 0) };
seatCharacter(ch, anchor, { role, vehicle: veh });
for (let i = 0; i < 60; i++) ch.update(1 / 30, { driving: true, speed: 0, grounded: true });
const H = new THREE.Vector3().copy(hip);
const cams = { side: [H.x + 2.2, H.y + 0.35, H.z + 0.2], front: [H.x, H.y + 0.6, H.z + 2.4], top: [H.x + 0.6, H.y + 2.0, H.z + 0.5], back: [H.x + 0.3, H.y + 1.0, H.z - 1.8], three: [H.x + 1.4, H.y + 0.8, H.z + 1.6] };
const cv = q.get('cam') || 'side';
if (cv === 'hand' || cv === 'handR') { const hb = ch.getBone(cv === 'hand' ? 'LeftHand' : 'RightHand').getWorldPosition(new THREE.Vector3()); camera.position.set(hb.x + 0.35, hb.y + 0.12, hb.z + 0.3); camera.lookAt(hb); }
else { camera.position.fromArray(cams[cv]); camera.lookAt(H.x, H.y + 0.3, H.z + 0.25); }
const g = (n) => ch.getBone(n).getWorldPosition(new THREE.Vector3());
const tor = g('Neck').sub(g('LeftUpLeg').add(g('RightUpLeg')).multiplyScalar(0.5)); const hdv = g('Head').sub(g('Neck'));
window.stats = { pitch: +(Math.atan2(-tor.z, tor.y) * 57.3).toFixed(1), headPitch: +(Math.atan2(-hdv.z, hdv.y) * 57.3).toFixed(1), reachLean: ch._seat.reachLean, extra: ch._seat.extraRecline, hip: g('LeftUpLeg').add(g('RightUpLeg')).multiplyScalar(0.5).toArray().map((x) => +x.toFixed(3)), anchor: C.hip, seat: { recl: ch._seat.extraRecline, sink: ch._seat.sink, chin: ch._seat.chin },
  head: g('Head').toArray().map((x) => +x.toFixed(2)), lhand: g('LeftHand').toArray().map((x) => +x.toFixed(2)), rhand: g('RightHand').toArray().map((x) => +x.toFixed(2)), feet: [g('LeftFoot').y.toFixed(2), g('RightFoot').y.toFixed(2)] };
function loop() { if (q.get('anim')) ch.update(1 / 60, { driving: true }); renderer.render(scene, camera); requestAnimationFrame(loop); }
loop(); window.ready = true;
</script></body></html>
